name: Tests API Newman

on:
  push:
  pull_request:

jobs:
  api-tests:

    runs-on: ubuntu-latest

    steps:

      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Newman
        run: npm install -g newman

      - name: Installer le rapport HTML
        run: npm install -g newman-reporter-htmlextra

      - name: Exécuter les tests API
        run: |
          mkdir -p newman
          newman run rapport.postman_collection.json \
            -r cli,htmlextra \
            --reporter-htmlextra-export newman/rapport.html

      - name: Publier le rapport Newman
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-newman
          path: newman/rapport.html
